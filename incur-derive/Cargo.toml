[package]
name = "incur-derive"
version = "0.1.0"
edition = "2024"
description = "Derive macro for incur CLI framework"
license = "MIT"
repository = "https://github.com/tempoxyz/incur-rs"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
